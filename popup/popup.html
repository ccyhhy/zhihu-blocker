<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知乎批量拉黑</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div><h1>知乎批量拉黑</h1><p>回答赞同者 · 粉丝 · 悬浮屏蔽</p></div>
    <div class="header-actions"><span id="speedMode" class="badge">直接批量</span><button id="closePanelBtn" class="btn btn-quiet" type="button" hidden>收起</button><button id="headerSettingsBtn" class="btn btn-quiet" type="button">设置</button></div>
  </header>
  <main>
    <section class="section" id="actionSection">
      <div class="section-heading"><h2>当前页面</h2><button class="btn btn-quiet" id="refreshPageBtn" type="button">重新识别</button></div>
      <div id="pageStatus" class="page-status">正在识别当前页面…</div>
      <label class="field-label" for="maxUsersInput">本次最多处理（留空或 0 表示全部）</label>
      <input id="maxUsersInput" type="number" min="0" step="1" placeholder="全部" style="width:100%">
      <div id="pageSpecialActions"></div>
      <p id="actionHint" class="action-hint" role="status" aria-live="polite"></p>
      <div class="progress-wrap" id="actionProgress" style="display:none" aria-live="polite">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText"></span>
        <div class="task-controls">
          <button id="taskToggleBtn" class="btn btn-secondary" type="button" hidden>暂停</button>
          <button id="taskEndBtn" class="btn btn-quiet" type="button" hidden>结束任务</button>
        </div>
      </div>
      <details class="task-evidence" hidden><summary>查看命中内容</summary><div id="taskEvidence"></div></details>
    </section>
    <section class="section">
      <div class="section-heading"><h2>评论赞同者</h2><span class="muted">当前不可用</span></div>
      <button class="btn btn-secondary btn-full" type="button" disabled>拉黑评论赞同者</button>
      <p class="action-hint">已核对的两个名单接口均返回 404，无法取得赞同者。不会改为处理评论作者。</p>
    </section>
    <section class="section">
      <div class="section-heading"><h2>悬浮卡片屏蔽</h2></div>
      <p class="action-hint">鼠标移到用户名上，在知乎用户卡片中选择「屏蔽并拉黑」或「仅本机屏蔽」。评论和用户主页也有入口。</p>
      <details id="hiddenDetails"><summary>本机屏蔽名单 <span id="hiddenCount"></span></summary><div id="hiddenList" class="rule-list"></div><p class="muted">恢复本机显示不会解除知乎黑名单。名单按用户主页标识保存，旧关键词规则已停用并保留原数据。</p></details>
    </section>
    <section class="section stats-section">
      <div class="stats">
        <div class="stat-item"><span class="stat-num" id="dailyCount">—</span><span class="stat-label">今日已拉黑</span></div>
        <div class="stat-item"><span class="stat-num" id="totalBlocked">—</span><span class="stat-label">当前账号累计</span></div>
      </div>
      <p id="accountHint" class="account-hint"></p>
    </section>
    <section class="section settings-section">
      <button class="section-toggle" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsBody">设置 <span class="arrow" aria-hidden="true">›</span></button>
      <div class="section-body" id="settingsBody" style="display:none">
        <div class="setting-row"><span id="intervalLabel">拉黑间隔（秒）</span><div class="interval-inputs"><input type="number" id="intervalMin" aria-label="最小拉黑间隔" min="0" max="30" step="0.1" value="0"><span>至</span><input type="number" id="intervalMax" aria-label="最大拉黑间隔" min="0" max="30" step="0.1" value="0"></div></div>
        <div class="setting-row"><label for="blockConcurrencyInput">并发拉黑数</label><input type="number" id="blockConcurrencyInput" min="1" max="20" step="1" value="5"></div>
        <p class="muted">间隔大于 0 时逐个处理；接口报错会暂停任务。</p>
        <button id="fastModeBtn" class="btn btn-secondary btn-full" type="button">快速模式：5 并发、无间隔</button>
        <label for="whitelistInput" class="field-label">白名单</label>
        <textarea id="whitelistInput" rows="3" placeholder="知乎主页地址或用户标识，每行一个"></textarea>
        <button id="saveSettingsBtn" class="btn btn-secondary btn-full" type="button">保存设置</button>
      </div>
    </section>
  </main>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
